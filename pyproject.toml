[project]
name = "beadwork-dev"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
prerelease = "disallow"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0.3",
  "ruff>=0.16.6",
  "ty>=0.0.79",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["scripts", "skills/beadwork-run/scripts", "tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-config", "--strict-markers"]
markers = [
  "unit: pure rules without Git or subprocesses",
  "integration: isolated filesystem, Git, or CLI boundaries",
  "workflow: end-to-end workflow scenarios",
]
