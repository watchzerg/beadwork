[project]
name = "beadwork-dev"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
prerelease = "disallow"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0.3",
  "ruff>=0.16.6",
  "ty>=0.0.79",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["scripts", "skills/beadwork-run/scripts", "tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-config", "--strict-markers"]
markers = [
  "unit: pure in-memory rules without real files, commands, or services in behavior or fixture setup",
  "integration: one capability collaborating with a real local filesystem, Git, CLI, or process boundary",
  "workflow: products passed across multiple operations, phase progression, or recovery scenarios",
  "distribution: integration tests for the independently copied skill distribution",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["scripts", "skills/beadwork-run/scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 这些公开脚本必须先禁用 bytecode，再加载 skill 内部模块。
"skills/beadwork-run/scripts/{controller,executor_operations,run_verification,worker_validation}.py" = ["E402"]

[tool.ty.src]
include = ["scripts", "skills/beadwork-run/scripts", "tests"]

[tool.ty.environment]
python-version = "3.14"
root = ["scripts", "skills/beadwork-run/scripts", "tests"]
